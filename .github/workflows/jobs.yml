name: Jobs search

# Every day (07:30 UTC) the newest offers on Jobs In Football are screened by Claude Haiku and the sports digital marketing
# roles are published on the Jobs page (pipeline/jobs.js); hide or edit them in Admin → Jobs.
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch: {}

concurrency:
  group: jobs-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci
        working-directory: pipeline
      - run: node jobs.js
        working-directory: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
