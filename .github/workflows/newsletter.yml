name: Weekly newsletter

# Every Monday at 08:00 Barcelona time: builds the SCP newsletter and creates a DRAFT in Resend,
# then emails a preview. Nothing reaches subscribers until someone presses Send in Resend.
# Cron runs in UTC (06:00 and 07:00) and GitHub often delays scheduled runs by hours, so the gate checks for Monday in Madrid, not the exact hour;
# weekly.mjs creates one issue per week, so the second run (or a late one) does nothing.
on:
  schedule:
    - cron: "0 6,7 * * 1"
  workflow_dispatch: {}      # "Run workflow" button in GitHub → Actions (always runs)

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Monday in Barcelona?
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(TZ=Europe/Madrid date +%u)" = "1" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "Not Monday in Madrid — skipping."; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci
        if: steps.gate.outputs.run == 'true'
        working-directory: pipeline
      - run: node newsletter/weekly.mjs
        if: steps.gate.outputs.run == 'true'
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SEGMENT_ID: ${{ secrets.RESEND_SEGMENT_ID }}
          NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM }}
          NEWSLETTER_REVIEW_TO: ${{ secrets.NEWSLETTER_REVIEW_TO }}
