name: AI video analysis

# Started by the ai-analyze function when someone unlocks the AI analysis of a video post:
# downloads the video, takes frames + transcript and posts them back to ai-analyze (pipeline/library/ai-video.mjs).
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "content_ideas id"
        required: true
      preview:
        description: "Only test: print the analysis, store nothing"
        type: boolean
        default: false

concurrency:
  group: ai-video-${{ inputs.post_id }}
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/ai-video.yml
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-v1
      - run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)
      - run: pip install -q faster-whisper==1.1.1 yt-dlp
      - run: npm ci
        working-directory: pipeline
      - run: node library/ai-video.mjs "${{ inputs.post_id }}" ${{ inputs.preview && '--preview' || '' }}
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
