name: Publish blog

# The blog posts edited in Admin → Blog (Supabase, table blog_posts) → content/blog/*.json → blog-tools/build.mjs (its
# checks) → static pages committed to main (GitHub Pages publishes them). Every hour, or "Run workflow" to publish now.
# Also the published Social News (one page each in news/), robots.txt / llms.txt and the home's schema (Admin → SEO).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Spanish versions translated by AI per run (blog-tools/sync-db.mjs): what is new or edited, at most this many
      TRANSLATE_PER_RUN: "15"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Posts from the admin → content/blog
        run: node blog-tools/sync-db.mjs export
      - name: Build the blog (checks every post)
        run: |
          if ! node blog-tools/build.mjs > build.log 2>&1; then
            cat build.log
            node blog-tools/sync-db.mjs fail build.log
            exit 1
          fi
          cat build.log
      - name: Publish if something changed
        run: |
          if [ -z "$(git status --porcelain -- content/blog content/news.json content/seo.json content/latest.json content/top.json blog news es blog.html news.html index.html pricing.html book-a-call.html contact.html signup.html sitemap.xml feed.xml robots.txt llms.txt assets/blog)" ]; then
            echo "Nothing changed."
          else
            git config user.name "SCP blog"
            git config user.email "actions@users.noreply.github.com"
            for p in content/blog content/news.json content/seo.json content/latest.json content/top.json blog news es blog.html news.html index.html pricing.html book-a-call.html contact.html signup.html sitemap.xml feed.xml robots.txt llms.txt assets/blog; do
              git add -A -- "$p" 2>/dev/null || true   # a path that doesn't exist yet (no news before supabase/seo.sql) is skipped
            done
            git commit -m "Blog + Social News: publish what was edited in the admin"
            git pull --rebase
            git push
          fi
      - name: Mark the posts as published
        run: node blog-tools/sync-db.mjs ok
