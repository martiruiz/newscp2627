name: Publish blog

# The blog posts edited in Admin → Blog (Supabase, table blog_posts) → content/blog/*.json → blog-tools/build.mjs (its
# checks) → static pages committed to main (GitHub Pages publishes them). Every hour, or "Run workflow" to publish now.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Posts from the admin → content/blog
        run: node blog-tools/sync-db.mjs export
      - name: Build the blog (checks every post)
        run: |
          if ! node blog-tools/build.mjs > build.log 2>&1; then
            cat build.log
            node blog-tools/sync-db.mjs fail build.log
            exit 1
          fi
          cat build.log
      - name: Publish if something changed
        run: |
          if [ -z "$(git status --porcelain -- content/blog blog blog.html news.html sitemap.xml robots.txt assets/blog)" ]; then
            echo "Nothing changed."
          else
            git config user.name "SCP blog"
            git config user.email "actions@users.noreply.github.com"
            git add content/blog blog blog.html news.html sitemap.xml robots.txt assets/blog
            git commit -m "Blog: publish the posts edited in the admin"
            git pull --rebase
            git push
          fi
      - name: Mark the posts as published
        run: node blog-tools/sync-db.mjs ok
