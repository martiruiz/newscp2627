name: Social News

# Runs every 30 hours. Cron can't express "every 30h", so the workflow wakes up
# every 6 hours and only does the work on every 5th slot (5 × 6h = 30h).
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}      # "Run workflow" button in GitHub → Actions (always runs)

concurrency:
  group: social-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Every 30 hours gate
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # 6-hour slot number since 1970 (rounded, so a delayed cron start still lands on its slot)
          slot=$(( ( $(date -u +%s) + 3*3600 ) / (6*3600) ))
          if [ $(( slot % 5 )) -eq 0 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "Not this slot — skipping."; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci
        if: steps.gate.outputs.run == 'true'
        working-directory: pipeline
      - run: node index.js
        if: steps.gate.outputs.run == 'true'
        working-directory: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
