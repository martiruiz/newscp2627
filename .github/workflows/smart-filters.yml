name: Smart filters

# The AI labels for the library's filters (pipeline/library/smart-auto.mjs): every 3 hours the finished batches are written
# into the library and the newly imported posts are sent (Batch API, Claude Haiku). "Run workflow" for a one-off:
#   run (default) · eval (accuracy on the reviewed posts) · test (100 posts at once, real cost)
on:
  # schedule:                 # every 3 hours — switched on once the eval and the test are approved
  #   - cron: "5 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run, eval, test or seed (30 posts to review in Admin → Smart filters)"
        default: "run"
      from:
        description: "run: posts imported since this day (YYYY-MM-DD; empty = last 7 days)"
        default: ""
      model:
        description: "eval only: another model to compare (empty = the one in use)"
        default: ""

concurrency:
  group: smart-filters
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci
        working-directory: pipeline
      - name: Label
        working-directory: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MODE: ${{ github.event.inputs.mode || 'run' }}
          FROM: ${{ github.event.inputs.from }}
          AI_CLASSIFY_MODEL: ${{ github.event.inputs.mode == 'eval' && github.event.inputs.model || '' }}
        run: |
          case "$MODE" in
            eval) node library/smart-auto.mjs --eval --diff ;;
            test) node library/smart-auto.mjs --test 100 ;;
            seed) node library/smart-auto.mjs --seed 30 ;;
            *)    node library/smart-auto.mjs --run ${FROM:+--from "$FROM"} ;;
          esac
