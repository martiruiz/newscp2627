name: Library logos (missing)

# On demand ("Run workflow" in GitHub → Actions): fills the logos the Content Library filters are missing
# (idea_catalog values of club / competition / sponsor with no logo_url). Only values WITHOUT a logo are touched,
# in this order (the first that finds one wins):
#   1. profile-logos.mjs   the club's / competition's / brand's own Instagram profile (scraped_profiles)
#   2. ig-avatars.mjs      the account that posts most of the value's Instagram posts (--only-missing)
#   3. football-logos.mjs  football-logos.cc (agreed 2026-10-20)
#   4. logos.mjs           Wikimedia Commons
# "apply" off = dry run: lists what is missing and what scripts 1-3 would pick (Wikimedia only runs with apply), writes nothing.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the logos (off = dry run)"
        type: boolean
        default: false

concurrency:
  group: library-logos
  cancel-in-progress: false

jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DRY: ${{ inputs.apply && ' ' || '--dry' }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci
      - name: Missing logos (before)
        run: |
          node --input-type=module -e '
            import { createClient } from "@supabase/supabase-js";
            const db = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, { auth: { persistSession: false } });
            for (const cat of ["club", "competition", "sponsor"]) {
              const { data, count } = await db.from("idea_catalog").select("name", { count: "exact" }).eq("category", cat).is("logo_url", null).order("name").limit(1000);
              console.log(`${cat}: ${count} without a logo`);
              for (const r of data || []) console.log(`   - ${r.name}`);
            }' | tee out.txt
          echo "::notice title=Missing logos::$(sed ':a;N;$!ba;s/\n/%0A/g' out.txt | cut -c1-60000)"
      - name: 1. Instagram profile (scraped profiles)
        run: |
          node library/profile-logos.mjs $DRY | tee out.txt
          echo "::notice::$(grep -E '✓|Done|stored|found|without' out.txt | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-60000)"
        continue-on-error: true
      - name: 2. Instagram account that posts them
        run: |
          node library/ig-avatars.mjs --only-missing $DRY | tee out.txt
          echo "::notice::$(grep -E '✓|Done|stored|found|without' out.txt | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-60000)"
        continue-on-error: true
      - name: 3. football-logos.cc
        run: |
          node library/football-logos.mjs $DRY | tee out.txt
          echo "::notice::$(grep -E '✓|Done|stored|found|without' out.txt | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-60000)"
        continue-on-error: true
      - name: 4. Wikimedia Commons
        if: ${{ inputs.apply }}   # its dry run would list every value, not just the missing ones
        run: |
          for c in club competition sponsor; do node library/logos.mjs --category $c $DRY; done | tee out.txt
          echo "::notice::$(grep -E '✓|stored|without' out.txt | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-60000)"
        continue-on-error: true
      - name: Missing logos (after)
        if: ${{ inputs.apply }}
        run: |
          node --input-type=module -e '
            import { createClient } from "@supabase/supabase-js";
            const db = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, { auth: { persistSession: false } });
            for (const cat of ["club", "competition", "sponsor"]) {
              const { data, count } = await db.from("idea_catalog").select("name", { count: "exact" }).eq("category", cat).is("logo_url", null).order("name").limit(1000);
              console.log(`${cat}: ${count} without a logo`);
              for (const r of data || []) console.log(`   - ${r.name}`);
            }' | tee out.txt
          echo "::notice title=Missing logos::$(sed ':a;N;$!ba;s/\n/%0A/g' out.txt | cut -c1-60000)"
