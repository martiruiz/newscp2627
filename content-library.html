<!doctype html>
<html lang="en" class="auth-checking">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Content Library — Sports Content Playbook</title>
  <meta name="description" content="Discover trends early, analyze what's working in real time and keep an eye on your competition.">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-s-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-s-64.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-s-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon-s.png">
  <link rel="stylesheet" href="css/fonts.css?v=1">
  <link rel="stylesheet" href="css/styles.css?v=20261101f">
  <script src="js/theme.js?v=20261028a"></script>
  <script src="js/i18n.js?v=20261101f"></script>
  <style>.auth-checking body { visibility: hidden; }</style>
  <script src="js/vendor/supabase-2.117.0.min.js"></script>
  <script src="js/config.js?v=20261020lf"></script>
  <script src="js/auth.js?v=20261101a"></script>
  <script src="js/guard.js?v=20261025b"></script>
</head>
<body class="library-page">

  <header class="site-nav" data-nav>
    <a class="brand" href="index.html" aria-label="Sports Content Playbook home"><img class="brand-logo" src="assets/logo-scp.png" alt="Sports Content Playbook" width="900" height="367"></a>
    <nav class="nav-links" aria-label="Main">
      <a href="index.html#how-it-works">How it works</a>
      <a href="content-library.html">Content Library</a>
      <a href="content-plan.html">Content Plan</a>
      <a href="news.html">Social News</a>
      <a href="pricing.html">Pricing</a>
    </nav>
    <div class="nav-actions">
      <a class="nav-user" href="profile.html" data-user-link><span class="nav-avatar" data-user-initials></span><span data-user-name></span></a>
      <a class="btn btn-outline" href="admin/content-ideas.html" hidden data-admin-link>Admin</a>
      <button class="btn btn-outline" type="button" data-logout>Log out</button>
    </div>
    <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" data-nav-toggle><span></span></button>
  </header>

  <main class="library" data-library>
    <!-- Filters column — sections and dropdowns are built by js/library.js from the catalog (empty filters are hidden) -->
    <aside class="filters lf" aria-label="Filters" data-filters>
      <div class="lf-head">
        <h1>Filters</h1><span class="lf-act" data-lf-active></span>
        <button class="lf-clear" type="button" data-clear>Clear all</button>
        <button class="lf-icon filters-hide" type="button" aria-label="Hide filters" title="Hide filters" data-hide-filters><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
        <button class="lf-icon lf-close" type="button" aria-label="Close filters" data-sheet-close><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <label class="lf-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" placeholder="Search filters or write what you need: signing reels that worked…" aria-label="Search filters" autocomplete="off" data-lf-search></label>
      <div class="lf-results" hidden data-lf-results role="listbox" aria-label="Matching filters"></div>
      <nav class="lf-jump" aria-label="Filter sections" data-lf-jump></nav>
      <div class="lf-body" data-lf-body>
        <div data-facets></div>
      </div>
      <div class="lf-foot"><button class="btn btn-gold lf-go" type="button" data-sheet-close><span data-lf-go>Show results</span></button></div>
    </aside>
    <div class="lf-scrim" data-sheet-close></div>
    <!-- Shown while the filters column is hidden (wide screens): floats where the column was and opens it again -->
    <button class="lf-icon filters-show" type="button" aria-label="Show filters" title="Show filters" data-show-filters><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg><b class="filter-count" hidden data-filter-count-float></b></button>

    <!-- Head across the posts and the Content Plan: search + "My space" (above the plan), then the filter bar to the edge -->
    <div class="lib-head" data-lib-head>
      <div class="feed-bar">
        <button class="pill pill-dark collapse" type="button" aria-expanded="true" data-collapse><img src="assets/chevron-duo.svg" alt=""><span data-collapse-label>Hide filters</span><b class="filter-count" hidden data-filter-count></b></button>
        <input type="hidden" data-q><!-- caption query, set by the "Coming up" dates (no visible search box) -->
        <div class="spacer"></div>
      </div>
      <div class="my-space" data-my-space>
        <span class="my-space-t">My space</span>
        <div class="my-space-btns">
          <button class="pill ai-mine" type="button" aria-pressed="false" hidden data-ai-mine><span data-icon="sparkles"></span><span class="lf-hide-sm">My AI analyses</span><b data-ai-mine-n></b></button>
          <button class="pill plan-toggle" type="button" aria-pressed="false" data-plan-toggle><span data-icon="calendar-days"></span><span class="lf-hide-sm">Content Plan</span></button>
          <a class="pill saved-link" href="saved.html" aria-pressed="false" data-saved-link data-boards-toggle><span data-icon="bookmark"></span><span class="lf-hide-sm">Saved boards</span></a>
        </div>
      </div>
      <!-- When (calendar icon) and order (Sort) of the posts: left of the filter bar -->
      <div class="lf-sortbar">
        <div class="lf-dd" data-dd>
          <button class="pill pill-dark lf-dd-btn" type="button" aria-haspopup="true" aria-expanded="false" data-dd-btn title="All time"><span data-icon="calendar-days"></span><span data-period-label>All time</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
          <div class="lf-menu" hidden data-dd-menu>
            <div class="lf-menu-list" data-toggle-group="single" data-period>
              <button type="button" aria-pressed="false" data-value="7">This week</button>
              <button type="button" aria-pressed="false" data-value="31">This month</button>
              <button type="button" aria-pressed="false" data-value="season">This season</button>
              <button type="button" aria-pressed="true" data-value="all">All time</button>
              <button type="button" aria-pressed="false" data-value="custom">Custom dates…</button>
            </div>
            <div class="rcal-wrap" hidden data-custom-dates>
              <div data-rcal><input type="hidden" data-from><input type="hidden" data-to></div>
            </div>
          </div>
        </div>
        <div class="lf-dd" data-dd>
          <button class="pill pill-dark lf-dd-btn" type="button" aria-haspopup="true" aria-expanded="false" data-dd-btn><span class="lf-dd-k">Sort</span><span data-order-label>Latest</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
          <div class="lf-menu" hidden data-dd-menu>
            <div class="lf-menu-list" data-toggle-group="single" data-order>
              <button type="button" aria-pressed="true" data-value="latest">Latest</button>
              <button type="button" aria-pressed="false" data-value="views" hidden data-views-order>Most viewed</button>
              <button type="button" aria-pressed="false" data-value="random">Surprise me</button>
            </div>
          </div>
        </div>
      </div>
      <div class="lfb" hidden data-lf-bar></div>
    </div>

    <section class="feed" aria-label="Posts">

      <div class="ai-strip" hidden data-ai-strip></div>
      <div class="lf-quick" data-lf-quick></div>

      <div class="active-bar" hidden data-active-bar>
        <div class="active-chips" data-active-chips></div>
        <div class="active-actions">
          <select class="saved-searches" data-saved-searches aria-label="Saved searches"><option value="">Saved searches…</option></select>
          <button class="pill pill-dark ab-save" type="button" title="Save search" aria-label="Save search" data-save-search><span data-icon="bookmark"></span></button>
        </div>
      </div>

      <p class="feed-note" hidden data-feed-note></p>
      <div class="cr-list" hidden data-creators aria-live="polite"></div>
      <div class="posts" data-posts aria-live="polite"></div>
      <p class="posts-empty" hidden data-empty>No posts match these filters.</p>
      <div class="load-more"><button class="pill pill-dark" type="button" hidden data-more>Load more</button></div>
    </section>
  </main>

  <!-- Post detail -->
  <div class="an-modal" hidden data-drawer role="dialog" aria-modal="true" aria-label="Post analysis">
    <div class="an-panel">
      <button class="an-close" type="button" aria-label="Close" data-drawer-close>×</button>
      <div class="an-body" data-drawer-body></div>
    </div>
  </div>

  <script src="js/icons.js?v=20261031b"></script>
  <script src="js/boards.js?v=20261031a"></script>
  <script src="js/range-cal.js?v=20261022a" defer></script>
  <script src="js/thumbs.js?v=20261018p"></script>
  <script src="js/covers.js?v=20261018p"></script>
  <script src="js/post-preview.js?v=20261018p"></script>
  <script src="js/key-dates.js?v=20261025a"></script>
  <script src="js/library.js?v=20261030a" defer></script>
  <script src="js/plan-panel.js?v=20261030a" defer></script>
  <script src="js/boards-panel.js?v=20261025d" defer></script>
  <script src="js/checkout.js?v=20261020lh"></script>

  <script src="js/nav-menu.js?v=20261031l"></script>

  <script src="js/lead-flow.js?v=20261028a"></script>

  <script src="js/promo-bar.js?v=20261020a"></script>

  <script src="js/main.js?v=20261027b"></script>
</body>
</html>
