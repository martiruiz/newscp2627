<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin — Sports Content Playbook</title>
  <link rel="icon" href="assets/icon-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=20261018c">
</head>
<body class="auth-page">
  <main class="admin container">
    <header class="admin-head">
      <a class="brand" href="index.html"><img src="assets/icon-logo.svg" alt="">Sports Content Playbook</a>
      <div class="admin-user" data-admin-user hidden>
        <span data-admin-email></span>
        <span class="pill pill-gold pill-sm" data-admin-role></span>
        <button class="btn btn-outline" type="button" data-logout>Log out</button>
      </div>
    </header>

    <p class="admin-message" data-admin-message>Loading…</p>

    <section data-admin-panel hidden>
      <div class="admin-title">
        <h1 class="section-title section-title-md">Users</h1>
        <p class="admin-count" data-admin-count></p>
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr><th>Name</th><th>Email</th><th>Plan</th><th>Signed up</th><th>Role</th></tr>
          </thead>
          <tbody data-admin-rows></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.min.js"></script>
  <script src="js/config.js?v=20261018c"></script>
  <script src="js/auth.js?v=20261018c"></script>
  <script src="js/admin.js?v=20261018c"></script>
</body>
</html>
