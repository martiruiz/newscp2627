<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gracias — Sports Content Playbook</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-s-32.png">
  <link rel="stylesheet" href="css/fonts.css?v=1">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; background: radial-gradient(ellipse at 50% 0%, #1e2a4d, #121b33 60%); color: #f3f5f9; font-family: Inter, Arial, sans-serif; }
    .card { width: 100%; max-width: 520px; padding: 36px 32px; background: #17213b; border: 1px solid rgba(240, 184, 74, .35); border-radius: 20px; box-sizing: border-box; }
    img { width: 150px; height: auto; display: block; margin-bottom: 26px; }
    p.eyebrow { margin: 0 0 10px; color: #f0b84a; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
    h1 { margin: 0 0 14px; font-family: "Host Grotesk", Inter, sans-serif; font-size: 28px; line-height: 1.2; }
    p { margin: 0 0 16px; color: #c9d1e0; font-size: 15px; line-height: 1.6; }
    a.btn { display: inline-block; margin-top: 8px; padding: 13px 24px; border-radius: 999px; background: linear-gradient(180deg, #ffe7ad, #f4c463 45%, #d79a2b); color: #1a1205; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <img src="assets/logo-scp.png" alt="Sports Content Playbook">
    <p class="eyebrow" data-t="eyebrow"></p>
    <h1 data-t="title"></h1>
    <p data-t="text"></p>
    <a class="btn" href="profile.html#billing" data-t="cta"></a>
  </main>
  <script src="js/config.js?v=20261020lf"></script>
  <script>
    // One-click answer from the cancellation e-mail: ?t=<token>&r=price|unused|content|missing|other&l=es|ca|en
    (() => {
      const q = new URLSearchParams(location.search);
      const lang = ["es", "ca", "en"].includes(q.get("l")) ? q.get("l") : "es";
      const T = {
        es: { eyebrow: "Gracias", title: "Gracias por contárnoslo", text: "Tu respuesta nos ayuda a mejorar SCP. Si cambias de opinión, puedes reactivar tu membresía desde tu cuenta antes de que termine.", cta: "Ir a mi cuenta", bad: "Este enlace ya no es válido, pero gracias igualmente." },
        ca: { eyebrow: "Gràcies", title: "Gràcies per explicar-nos-ho", text: "La teva resposta ens ajuda a millorar SCP. Si canvies d'opinió, pots reactivar la membresia des del teu compte abans que acabi.", cta: "Anar al meu compte", bad: "Aquest enllaç ja no és vàlid, però gràcies igualment." },
        en: { eyebrow: "Thank you", title: "Thanks for telling us", text: "Your answer helps us improve SCP. If you change your mind, you can reactivate your membership from your account before it ends.", cta: "Go to my account", bad: "This link has expired, but thank you anyway." },
      }[lang];
      // e=1: from the "your trial has ended" e-mail (no membership left to reactivate)
      if (q.get("e") === "1") T.text = { es: "Tu respuesta nos ayuda a mejorar SCP.", ca: "La teva resposta ens ajuda a millorar SCP.", en: "Your answer helps us improve SCP." }[lang];
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = T[el.dataset.t]; });
      const cfg = window.SCP_CONFIG || {};
      const token = q.get("t"), reason = q.get("r");
      if (!token || !reason || !cfg.supabaseUrl) return;
      fetch(`${cfg.supabaseUrl}/rest/v1/rpc/cancel_feedback_answer`, { method: "POST", headers: { apikey: cfg.supabaseAnonKey, "Content-Type": "application/json" }, body: JSON.stringify({ p_token: token, p_reason: reason }) })
        .then((r) => r.json()).then((ok) => { if (ok !== true) document.querySelector('[data-t="text"]').textContent = T.bad; }).catch(() => {});
    })();
  </script>
</body>
</html>
