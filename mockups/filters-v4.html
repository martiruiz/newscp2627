<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library filters v4</title>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#121b33;--surface:#17213b;--surface-2:#1d2845;--surface-3:#213050;--gold:#f0b84a;--gold-light:#ffe0a0;--gold-tint:rgba(240,184,74,.2);--muted:#b4c0d3;--dim:rgba(180,192,211,.5);--line:rgba(255,255,255,.1);--soft:rgba(255,255,255,.05);--fd:"Host Grotesk",system-ui,sans-serif;--fb:"Inter",system-ui,sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:#fff;font-family:var(--fb);font-size:13px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.page{display:grid;grid-template-columns:288px minmax(0,1fr);gap:22px;max-width:1360px;margin:0 auto;padding:20px 24px 60px}

/* ---------- feed bar ---------- */
.fbar{display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:4;background:var(--bg);padding:6px 0 10px}
.search{flex:1;display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:100px;background:var(--surface-2);border:.5px solid var(--line);color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;color:#fff;font:inherit;font-size:14px;outline:none}
.dd{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:100px;background:var(--surface-2);border:.5px solid var(--line);color:var(--muted);white-space:nowrap}
.dd b{color:#fff;font-weight:500}
.fbtn{display:none;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:100px;background:var(--gold);color:#121b33;font-weight:600}
.fbtn em{font-style:normal;background:#121b33;color:var(--gold);border-radius:100px;padding:1px 7px;font-size:11px}
.active{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 9px 0 11px;border-radius:100px;background:var(--gold-tint);color:var(--gold);font-size:12px;white-space:nowrap}
.chip i{font-style:normal;opacity:.7}
.chip .mini{width:18px;height:18px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden}
.chip .mini img{width:14px;height:14px;object-fit:contain}
.count{margin-left:auto;flex:none;color:var(--muted)}.count b{color:#fff;font-family:var(--fd)}
.grid{columns:4 200px;column-gap:14px;margin-top:12px}
.card{break-inside:avoid;margin-bottom:14px;border-radius:14px;background:var(--surface-2);border:.5px solid var(--soft)}

/* ---------- filter column ---------- */
.side{align-self:start;position:sticky;top:20px;background:var(--surface);border:.5px solid var(--line);border-radius:20px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:inset 0 0 25px rgba(255,255,255,.04)}
.side-head{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 6px}
.side-head h2{margin:0;font-family:var(--fd);font-size:17px;font-weight:600}
.side-head .clear{color:var(--gold);font-size:12px}
.side-head .x{display:none;width:34px;height:34px;border-radius:50%;background:var(--surface-2);place-items:center}
.side-body{overflow:auto;padding:0 8px 12px;scrollbar-width:thin}
.side-foot{display:none}
.blk{padding:12px 8px 14px;border-bottom:.5px solid var(--line)}
.blk:last-child{border-bottom:0}
.bt{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-family:var(--fd);font-weight:600;font-size:14px}
.bt .num{width:20px;height:20px;border-radius:50%;background:var(--gold-tint);color:var(--gold);font-size:11px;display:grid;place-items:center}
.ai{font-family:var(--fb);font-size:9px;letter-spacing:.06em;color:#a99bff;background:rgba(122,92,255,.16);padding:2px 6px;border-radius:5px;font-weight:500}
.sub{font-size:11px;color:var(--dim);margin:12px 0 6px}

/* 1 · the best */
.sps{display:grid;gap:8px}
.sp{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:100px;font-family:var(--fd);font-weight:600;font-size:14px;color:#fff;opacity:.5;filter:saturate(.55);transition:.25s;text-align:left}
.sp svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2.2}
.sp .n{margin-left:auto;font-family:var(--fb);font-weight:500;font-size:11px;background:rgba(0,0,0,.2);padding:2px 8px;border-radius:100px}
.sp:hover{opacity:.85;filter:none}.sp.on{opacity:1;filter:none}
.sp-top{background:linear-gradient(90deg,#f32f71,#ff685c)}.sp-top.on{animation:gT 3.6s infinite}
.sp-rep{background:linear-gradient(90deg,#00d85b,#00ccdd)}.sp-rep.on{animation:gR 3.6s infinite}
.sp-over{background:linear-gradient(90deg,#4d5bff,#7a5cff)}.sp-over.on{animation:gO 3.6s infinite}
.sp.on::after{content:"";position:absolute;inset:0 auto 0 -60%;width:45%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:sh 3.6s ease-in-out infinite}
@keyframes sh{0%,55%{left:-60%}85%,100%{left:130%}}
@keyframes gT{0%,100%{box-shadow:0 0 14px rgba(255,104,92,.45)}50%{box-shadow:0 0 26px 2px rgba(255,104,92,.75)}}
@keyframes gR{0%,100%{box-shadow:0 0 14px rgba(0,216,91,.4)}50%{box-shadow:0 0 26px 2px rgba(0,216,91,.7)}}
@keyframes gO{0%,100%{box-shadow:0 0 14px rgba(122,92,255,.45)}50%{box-shadow:0 0 26px 2px rgba(122,92,255,.75)}}
.hist{display:flex;align-items:flex-end;gap:2px;height:58px;margin:4px 2px 0}
.hist i{flex:1;border-radius:3px 3px 1px 1px;background:rgba(180,192,211,.16);min-height:3px;transition:.2s}
.hist i.in{background:linear-gradient(180deg,var(--gold-light),var(--gold));box-shadow:0 0 8px rgba(240,184,74,.3)}
.rng{position:relative;height:24px;margin:3px 2px 0}
.rng .tr{position:absolute;left:0;right:0;top:10px;height:4px;border-radius:4px;background:var(--surface-3)}
.rng .fl{position:absolute;top:10px;height:4px;border-radius:4px;background:var(--gold)}
.rng input{position:absolute;inset:0;width:100%;margin:0;background:none;-webkit-appearance:none;appearance:none;pointer-events:none}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--gold);box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:grab}
.rng input::-moz-range-thumb{pointer-events:auto;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--gold)}
.rl{display:flex;justify-content:space-between;margin-top:4px;font-size:12px;font-family:var(--fd);font-weight:600}

/* 2 · how */
.icons{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.ib{width:100%;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);border:.5px solid var(--soft);color:var(--muted);transition:.2s;position:relative}
.ib.logo{opacity:.45}
.ib.logo svg{width:22px;height:22px}
.ib:hover{opacity:1;color:#fff}
.ib.on{opacity:1;color:var(--gold);border-color:var(--gold);background:var(--gold-tint)}
.ib.logo.on{background:var(--surface-2)}
.ib .i{width:20px;height:20px}
.ib[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:46px;left:50%;transform:translateX(-50%);background:var(--surface-3);color:#fff;font-size:11px;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:3}
.lnk{display:flex;align-items:center;gap:6px;color:var(--gold);font-size:12px;margin-top:10px}
.lnk svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .25s}
.lnk.open svg{transform:rotate(180deg)}
.extra{display:none;margin-top:4px}.extra.open{display:block}
.shape{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.shape button{height:54px;border-radius:10px;border:.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--muted);font-size:11px}
.shape i{border:1.6px solid currentColor;border-radius:3px;display:block}
.shape button.on{color:var(--gold);border-color:var(--gold);background:var(--gold-tint)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.c{height:30px;padding:0 11px;border-radius:100px;border:.5px solid var(--line);color:var(--muted);font-size:12px;white-space:nowrap}
.c em{font-style:normal;color:var(--dim);margin-left:5px;font-size:11px}
.c:hover{color:#fff}
.c.on{border-color:var(--gold);color:var(--gold);background:var(--gold-tint)}

/* 3 · who */
.crests{display:grid;grid-template-columns:repeat(5,1fr);gap:8px 2px}
.cr{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:10px;min-width:0}
.cr .d{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;border:2px solid transparent;transition:.25s;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.cr .d img{width:26px;height:26px;object-fit:contain}
.cr .d b{font-family:var(--fd);font-size:9px;color:#121b33;font-weight:700}
.cr span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr:hover .d{transform:translateY(-2px) scale(1.06)}
.cr.on{color:var(--gold)}.cr.on .d{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-tint)}
.clubs-h{display:flex;align-items:center;justify-content:space-between}
.clubs-h button{color:var(--gold);font-size:11px}

/* 4/5 · folded groups */
.acc{border-radius:12px;margin:2px 0}
.acc-h{width:100%;display:flex;align-items:center;gap:10px;min-height:42px;padding:0 8px;border-radius:12px;text-align:left}
.acc-h:hover{background:var(--surface-2)}
.acc-h .i{color:var(--gold)}
.acc-h .t{flex:1;font-weight:500}
.acc-h em{font-style:normal;font-size:11px;background:var(--gold);color:#121b33;border-radius:100px;padding:1px 7px;font-weight:600}
.acc-h .chev{width:14px;height:14px;stroke:var(--dim);fill:none;stroke-width:2;transition:transform .25s;flex:none}
.acc.open>.acc-h .chev{transform:rotate(180deg)}
.acc-b{display:none;padding:4px 8px 12px}
.acc.open>.acc-b{display:block}
.acc.open{background:rgba(255,255,255,.025)}
.peek{display:flex;margin-right:2px}
.peek span{width:22px;height:22px;border-radius:6px;background:#fff;color:#121b33;font-family:var(--fd);font-weight:700;font-size:7px;display:grid;place-items:center;margin-left:-5px;border:1.5px solid var(--surface);letter-spacing:-.02em}
.acc.open .peek{display:none}
.brands{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.br{height:44px;border-radius:10px;background:#fff;color:#121b33;font-family:var(--fd);font-weight:700;font-size:13px;letter-spacing:-.02em;border:2px solid transparent;opacity:.85;transition:.2s}
.br:hover{opacity:1;transform:translateY(-1px)}
.br.on{opacity:1;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-tint)}
.credit{font-size:10px;color:var(--dim);padding:10px 8px 0}

/* ---------- mobile: bottom sheet ---------- */
.scrim{display:none}
@media (max-width:760px){
  .page{display:block;padding:10px 14px 40px}
  .fbar .dd{display:none}
  .fbtn{display:inline-flex}
  .grid{columns:2;column-gap:10px}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;max-height:88vh;border-radius:22px 22px 0 0;transform:translateY(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  .side.open{transform:none}
  .side::before{content:"";width:40px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 0}
  .side-head .x{display:grid}
  .side-head .clear{margin-left:auto;margin-right:12px}
  .side-foot{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:.5px solid var(--line);background:var(--surface)}
  .side-foot .sort{flex:none}
  .side-foot .go{flex:1;height:48px;border-radius:100px;background:var(--gold);color:#121b33;font-weight:600;font-size:15px}
  .scrim{display:block;position:fixed;inset:0;background:rgba(5,10,25,.6);opacity:0;pointer-events:none;transition:.3s;z-index:19}
  .scrim.open{opacity:1;pointer-events:auto}
  .ib{height:46px}
  .cr .d{width:44px;height:44px}
}
</style>
</head>
<body>
<div class="page">

  <aside class="side" data-side aria-label="Filters">
    <div class="side-head"><h2>Filters</h2><button class="clear">Clear all</button><button class="x" data-close aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="side-body">

      <!-- 1 · THE BEST -->
      <div class="blk">
        <div class="bt"><span class="num">1</span>The best</div>
        <div class="sps">
          <button class="sp sp-top on" data-t><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Top Picks<span class="n">1,240</span></button>
          <button class="sp sp-rep" data-t><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>Replicable ideas<span class="n">3,610</span></button>
          <button class="sp sp-over" data-t><svg viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>Overperforming<span class="n">890</span></button>
        </div>
        <div class="sub">Views</div>
        <div class="hist" data-hist></div>
        <div class="rng"><div class="tr"></div><div class="fl" data-fill></div><input type="range" min="0" max="28" value="9" data-lo aria-label="Minimum views"><input type="range" min="0" max="28" value="28" data-hi aria-label="Maximum views"></div>
        <div class="rl"><span data-lo-l></span><span data-hi-l></span></div>
      </div>

      <!-- 2 · HOW -->
      <div class="blk">
        <div class="bt"><span class="num">2</span>How</div>
        <div class="icons" data-many>
          <button class="ib logo on" data-tip="Instagram"><svg viewBox="0 0 24 24"><defs><radialGradient id="ig" cx="30%" cy="107%" r="150%"><stop offset=".1" stop-color="#fdf497"/><stop offset=".5" stop-color="#fd5949"/><stop offset=".68" stop-color="#d6249f"/><stop offset="1" stop-color="#285AEB"/></radialGradient></defs><rect width="24" height="24" rx="6" fill="url(#ig)"/><rect x="5.5" y="5.5" width="13" height="13" rx="4" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="12" r="3.1" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="16.3" cy="7.7" r="1" fill="#fff"/></svg></button>
          <button class="ib logo" data-tip="TikTok"><svg viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#000"/><path d="M13.5 5v9.2a2.6 2.6 0 1 1-2.6-2.6" fill="none" stroke="#25F4EE" stroke-width="2" transform="translate(-.6 -.4)"/><path d="M13.5 5v9.2a2.6 2.6 0 1 1-2.6-2.6" fill="none" stroke="#FE2C55" stroke-width="2" transform="translate(.6 .4)"/><path d="M13.5 5v9.2a2.6 2.6 0 1 1-2.6-2.6M13.5 5c.3 2 1.7 3.3 3.8 3.4" fill="none" stroke="#fff" stroke-width="2"/></svg></button>
          <button class="ib logo" data-tip="YouTube"><svg viewBox="0 0 24 24"><rect x="1" y="5" width="22" height="14" rx="4.5" fill="#FF0000"/><path d="m10 9 5 3-5 3z" fill="#fff"/></svg></button>
          <button class="ib logo" data-tip="X"><svg viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#000"/><path d="m6.5 6 11 12M17.5 6l-11 12" stroke="#fff" stroke-width="1.8"/></svg></button>
          <button class="ib logo" data-tip="Facebook"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#0866FF"/><path d="M13.3 24v-8.4h2.6l.4-3.1h-3V10.6c0-.9.3-1.5 1.6-1.5h1.6V6.4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.2H7.7v3.1h2.6V24z" fill="#fff"/></svg></button>
          <button class="ib logo" data-tip="LinkedIn"><svg viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#0A66C2"/><path d="M7 10v7M7 7v.01M11 17v-7M11 13.5c0-2 1-3.6 3-3.6s2.5 1.4 2.5 3.3V17" stroke="#fff" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></button>
        </div>
        <div class="icons" style="margin-top:6px" data-many>
          <button class="ib on" data-tip="Reel"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="m10.5 9.5 4 2.5-4 2.5z"/></svg></button>
          <button class="ib" data-tip="Carousel"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="4" width="11" height="16" rx="2"/><path d="M19 6v12M22 8v8"/></svg></button>
          <button class="ib" data-tip="Image"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg></button>
          <button class="ib" data-tip="Video"><svg class="i" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="m10 9.5 5 2.5-5 2.5z"/></svg></button>
        </div>
        <button class="lnk" data-extra>More format options<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="extra">
          <div class="sub">Shape</div>
          <div class="shape" data-many><button><i style="width:12px;height:21px"></i>9:16</button><button class="on"><i style="width:17px;height:21px"></i>4:5</button><button><i style="width:19px;height:19px"></i>1:1</button><button><i style="width:26px;height:15px"></i>16:9</button></div>
          <div class="sub">Duration</div>
          <div class="chips" data-many><button class="c">&lt;15s</button><button class="c">15–30s</button><button class="c">30–60s</button><button class="c">60s+</button></div>
          <div class="sub">Language</div>
          <div class="chips" data-many><button class="c">English<em>12k</em></button><button class="c">Spanish<em>6k</em></button><button class="c">Catalan<em>1.1k</em></button><button class="c">+28</button></div>
        </div>
      </div>

      <!-- 3 · WHO -->
      <div class="blk">
        <div class="bt"><span class="num">3</span>Who</div>
        <div class="icons" data-one>
          <button class="ib on" data-tip="Football"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5l3.8 2.8-1.5 4.4H9.7l-1.5-4.4zM12 3v4.5M20.6 9.5l-4.8.8M17.5 19.5l-3.2-4.8M6.5 19.5l3.2-4.8M3.4 9.5l4.8.8"/></svg></button>
          <button class="ib" data-tip="Basketball"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18M5.6 5.6c3 3 3 9.8 0 12.8M18.4 5.6c-3 3-3 9.8 0 12.8"/></svg></button>
          <button class="ib" data-tip="Handball"><svg class="i" viewBox="0 0 24 24"><circle cx="16" cy="6" r="3"/><path d="M5 21l4-6 3 2 3-5-4-3-4 3"/></svg></button>
          <button class="ib" data-tip="Tennis"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5.5 5.5c3.5 3.5 3.5 9.5 0 13M18.5 5.5c-3.5 3.5-3.5 9.5 0 13"/></svg></button>
          <button class="ib" data-tip="Motorsport"><svg class="i" viewBox="0 0 24 24"><path d="M4 21V4M4 4h14l-3 4 3 4H4"/></svg></button>
          <button class="ib" data-tip="More sports"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
        </div>
        <div class="sub">Competition</div>
        <div class="crests" data-comps></div>
        <button class="lnk">See all 64 competitions</button>
        <div class="sub clubs-h"><span data-clubs-t>Top clubs</span><button data-clubs-all>Search clubs</button></div>
        <div class="crests" data-clubs></div>
      </div>

      <!-- 4 · WHAT -->
      <div class="blk">

        <div class="acc open"><button class="acc-h"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span class="t">Moment</span><em>1</em><svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
// toggles
$$("[data-many]").forEach(g=>g.addEventListener("click",e=>{const b=e.target.closest("button");if(b)b.classList.toggle("on")}));
$$("[data-one]").forEach(g=>g.addEventListener("click",e=>{const b=e.target.closest("button");if(b)$$("button",g).forEach(x=>x.classList.toggle("on",x===b))}));
$$("[data-t]").forEach(b=>b.addEventListener("click",()=>b.classList.toggle("on")));
$$(".acc-h").forEach(h=>h.addEventListener("click",()=>h.parentElement.classList.toggle("open")));
$("[data-extra]").addEventListener("click",e=>{e.currentTarget.classList.toggle("open");e.currentTarget.nextElementSibling.classList.toggle("open")});
// mobile sheet
const side=$("[data-side]"),scrim=$("[data-scrim]");
$("[data-open]").addEventListener("click",()=>{side.classList.add("open");scrim.classList.add("open")});
$$("[data-close]").forEach(b=>b.addEventListener("click",()=>{side.classList.remove("open");scrim.classList.remove("open")}));
// crests
const comps=[["LALIGA","LaLiga"],["PL","Premier"],["UCL","Champions"],["SA","Serie A"],["BL","Bundesliga"],["L1","Ligue 1"],["LF","Liga F"],["UWCL","Women's CL"],["NBA","NBA"],["ACB","Liga ACB"]];
const clubsBy={LaLiga:[["img","logo-realmadrid.png","Real Madrid"],["img","logo-betis.png","Betis"],["img","logo-realsociedad.png","Real Sociedad"],["t","FCB","Barcelona"],["t","ATM","Atlético"],["t","VCF","Valencia"],["t","ATH","Athletic"],["t","SEV","Sevilla"],["t","VIL","Villarreal"],["t","GIR","Girona"]]};
const topClubs=[["img","logo-realmadrid.png","Real Madrid"],["t","FCB","Barcelona"],["t","MCI","Man City"],["t","LIV","Liverpool"],["t","PSG","PSG"],["t","BAY","Bayern"],["t","ARS","Arsenal"],["t","JUV","Juventus"],["t","MIA","Inter Miami"],["t","LAL","Lakers"]];
const crest=(k,v,n,on)=>`<button class="cr${on?" on":""}"><span class="d">${k==="img"?`<img src="../assets/${v}" alt="">`:`<b>${v}</b>`}</span><span>${n}</span></button>`;
const cEl=$("[data-comps]"),clEl=$("[data-clubs]");
cEl.innerHTML=comps.map(([a,n])=>crest("t",a,n)).join("");
const showClubs=(comp)=>{$("[data-clubs-t]").textContent=comp?`Clubs in ${comp}`:"Top clubs";clEl.innerHTML=(comp?clubsBy[comp]||topClubs:topClubs).map(([k,v,n])=>crest(k,v,n,n==="Real Madrid")).join("")};
showClubs(null);
cEl.addEventListener("click",e=>{const b=e.target.closest(".cr");if(!b)return;const was=b.classList.contains("on");$$(".cr",cEl).forEach(x=>x.classList.remove("on"));if(!was)b.classList.add("on");showClubs(was?null:b.textContent.trim())});
clEl.addEventListener("click",e=>{const b=e.target.closest(".cr");if(b)b.classList.toggle("on")});
// views histogram (log scale 1K – 50M)
const N=28,edges=[...Array(N+1)].map((_,i)=>1000*Math.pow(50000,i/N));
const counts=[...Array(N)].map((_,i)=>Math.round(900*Math.exp(-Math.pow((i-11)/5.2,2))+20)),mx=Math.max(...counts),hist=$("[data-hist]");
counts.forEach(c=>{const b=document.createElement("i");b.style.height=Math.max(5,c/mx*100)+"%";hist.appendChild(b)});
const lo=$("[data-lo]"),hi=$("[data-hi]"),fl=$("[data-fill]");
const fmt=v=>v>=1e6?(v/1e6).toFixed(v<1e7?1:0).replace(".0","")+"M":Math.round(v/1e3)+"K";
function upd(e){let a=+lo.value,b=+hi.value;if(a>b-1){if(e&&e.target===lo)lo.value=a=b-1;else hi.value=b=a+1}
  $$("i",hist).forEach((x,i)=>x.classList.toggle("in",i>=a&&i<b));fl.style.left=(a/N*100)+"%";fl.style.right=(100-b/N*100)+"%";
  $("[data-lo-l]").textContent=fmt(edges[a]);$("[data-hi-l]").textContent=b===N?fmt(edges[b])+"+":fmt(edges[b])}
lo.addEventListener("input",upd);hi.addEventListener("input",upd);upd();
