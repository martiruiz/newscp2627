<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library filters v3</title>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#121b33;--surface:#17213b;--surface-2:#1d2845;--surface-3:#213050;--gold:#f0b84a;--gold-light:#ffe0a0;--gold-tint:rgba(240,184,74,.2);--text:#fff;--muted:#b4c0d3;--dim:rgba(180,192,211,.45);--line:rgba(255,255,255,.1);--soft:rgba(255,255,255,.05);--fd:"Host Grotesk",system-ui,sans-serif;--fb:"Inter",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fb);font-size:13px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.page{display:grid;grid-template-columns:290px 1fr;gap:22px;max-width:1360px;margin:0 auto;padding:22px 24px 60px}

/* ---------- top bar ---------- */
.bar{grid-column:1/-1;display:flex;align-items:center;gap:10px;background:var(--surface);border:.5px solid var(--line);border-radius:18px;padding:8px;position:sticky;top:10px;z-index:5;box-shadow:inset 0 0 25px rgba(255,255,255,.05),0 10px 30px rgba(0,0,0,.25)}
.search{flex:1 1 200px;min-width:200px;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:12px;background:var(--surface-2);color:var(--muted)}
.search input{flex:1;background:none;border:0;color:#fff;font:inherit;font-size:14px;outline:none}
.vr{width:.5px;height:26px;background:var(--line)}
.sp{flex:none;position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:100px;font-family:var(--fd);font-weight:600;font-size:14px;color:#fff;white-space:nowrap;opacity:.5;filter:saturate(.55);transition:.25s}
.sp:hover{opacity:.85;filter:none}.sp.on{opacity:1;filter:none}
.sp svg{width:16px;height:16px}
.sp-top{background:linear-gradient(90deg,#f32f71,#ff685c)}.sp-top.on{animation:gT 3.6s infinite}
.sp-rep{background:linear-gradient(90deg,#00d85b,#00ccdd)}.sp-rep.on{animation:gR 3.6s infinite}
.sp-over{background:linear-gradient(90deg,#4d5bff,#7a5cff)}.sp-over.on{animation:gO 3.6s infinite}
.sp.on::after{content:"";position:absolute;inset:0 auto 0 -60%;width:45%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:sh 3.6s ease-in-out infinite}
@keyframes sh{0%,55%{left:-60%}85%,100%{left:130%}}
@keyframes gT{0%,100%{box-shadow:0 0 18px rgba(255,104,92,.5)}50%{box-shadow:0 0 34px 3px rgba(255,104,92,.8)}}
@keyframes gR{0%,100%{box-shadow:0 0 18px rgba(0,216,91,.45)}50%{box-shadow:0 0 34px 3px rgba(0,216,91,.75)}}
@keyframes gO{0%,100%{box-shadow:0 0 18px rgba(122,92,255,.5)}50%{box-shadow:0 0 34px 3px rgba(122,92,255,.8)}}
.pf{display:flex;gap:4px}
.pf button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;opacity:.4;transition:.2s}
.pf button:hover{opacity:.8;background:var(--surface-2)}
.pf button.on{opacity:1;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--gold)}
.pf svg{width:22px;height:22px}
.fm{display:flex;gap:4px}
.fm button{width:38px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);transition:.2s;position:relative}
.fm svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fm button:hover{color:#fff;background:var(--surface-2)}
.fm button.on{color:var(--gold);background:var(--gold-tint)}
.fm button[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:42px;left:50%;transform:translateX(-50%);background:var(--surface-3);color:#fff;font-size:11px;padding:4px 8px;border-radius:6px;white-space:nowrap}
.dd{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:12px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.dd b{color:#fff;font-weight:500}
.dd svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

/* ---------- sidebar ---------- */
.side{align-self:start;position:sticky;top:84px;background:var(--surface);border:.5px solid var(--line);border-radius:18px;padding:6px 6px 10px;max-height:calc(100vh - 100px);overflow:auto;scrollbar-width:thin}
.side-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 8px}
.side-head h2{margin:0;font-family:var(--fd);font-size:16px;font-weight:600}
.side-head button{color:var(--gold);font-size:12px}
.grp-t{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:12px 12px 4px;display:flex;align-items:center;gap:6px}
.ai{font-size:9px;letter-spacing:.06em;color:#a99bff;background:rgba(122,92,255,.16);padding:2px 6px;border-radius:5px}
.acc{border-radius:12px;transition:background .2s}
.acc.open{background:var(--surface-2);margin:4px 0}
.acc-h{width:100%;display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:12px;text-align:left}
.acc-h:hover{background:var(--surface-2)}
.acc-h .ico{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.acc-h span{flex:1;font-weight:500}
.acc-h em{font-style:normal;font-size:11px;background:var(--gold);color:#121b33;border-radius:100px;padding:1px 7px;font-weight:600}
.acc-h .chev{width:14px;height:14px;stroke:var(--dim);fill:none;stroke-width:2;transition:transform .25s}
.acc.open .chev{transform:rotate(180deg)}
.acc-b{display:none;padding:2px 12px 14px}
.acc.open .acc-b{display:block}
.mini{width:100%;height:32px;margin:0 0 8px;padding:0 10px;border-radius:9px;border:.5px solid var(--line);background:var(--surface);color:#fff;font:inherit;font-size:12px;outline:none}
.opt{display:flex;align-items:center;gap:9px;width:100%;height:32px;padding:0 6px;border-radius:8px;color:var(--muted);text-align:left}
.opt:hover{background:rgba(255,255,255,.04);color:#fff}
.opt .bx{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--dim);flex:none;display:grid;place-items:center}
.opt.on{color:#fff}.opt.on .bx{background:var(--gold);border-color:var(--gold)}
.opt.on .bx::after{content:"";width:8px;height:4px;border:2px solid #121b33;border-top:0;border-right:0;transform:rotate(-45deg) translateY(-1px)}
.opt .n{margin-left:auto;color:var(--dim);font-size:11px}
.crest{width:22px;height:22px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.crest img{width:17px;height:17px;object-fit:contain}
.crest b{font-family:var(--fd);font-size:7.5px;color:#121b33;font-weight:700}
.more{color:var(--gold);font-size:12px;padding:6px 6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.c{height:28px;padding:0 10px;border-radius:100px;border:.5px solid var(--line);color:var(--muted);font-size:12px}
.c.on{border-color:var(--gold);color:var(--gold);background:var(--gold-tint)}
.shape{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.shape button{height:58px;border-radius:10px;border:.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--muted);font-size:11px}
.shape i{border:1.6px solid currentColor;border-radius:3px;display:block}
.shape button.on{color:var(--gold);border-color:var(--gold);background:var(--gold-tint)}

/* views histogram */
.hist{display:flex;align-items:flex-end;gap:3px;height:74px;margin:6px 2px 0}
.hist i{flex:1;border-radius:3px 3px 1px 1px;background:rgba(180,192,211,.18);transition:background .2s,box-shadow .2s;min-height:3px}
.hist i.in{background:linear-gradient(180deg,var(--gold-light),var(--gold));box-shadow:0 0 10px rgba(240,184,74,.35)}
.rng{position:relative;height:26px;margin:4px 2px 0}
.rng .track{position:absolute;left:0;right:0;top:11px;height:4px;border-radius:4px;background:var(--surface-3)}
.rng .fill{position:absolute;top:11px;height:4px;border-radius:4px;background:var(--gold)}
.rng input{position:absolute;inset:0;width:100%;margin:0;background:none;-webkit-appearance:none;appearance:none;pointer-events:none}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--gold);box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:grab}
.rng input::-moz-range-thumb{pointer-events:auto;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--gold);cursor:grab}
.rl{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--muted)}
.rl b{color:#fff;font-family:var(--fd);font-weight:600}
.rsum{font-size:11px;color:var(--dim);margin-top:4px}

/* feed */
.feed{min-width:0}
.active{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:32px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 10px;border-radius:100px;background:var(--gold-tint);color:var(--gold);font-size:12px}
.chip .crest{width:18px;height:18px}.chip .crest img{width:14px;height:14px}
.chip i{font-style:normal;opacity:.7}
.count{margin-left:auto;color:var(--muted)}.count b{color:#fff;font-family:var(--fd)}
.grid{columns:4 200px;column-gap:14px;margin-top:14px}
.card{break-inside:avoid;margin-bottom:14px;border-radius:14px;background:var(--surface-2);border:.5px solid var(--soft)}

.bar{flex-direction:column;align-items:stretch;gap:0;padding:0}
.row1{display:flex;align-items:center;gap:10px;padding:8px}
.row2{display:flex;align-items:center;gap:6px;padding:8px 12px 10px;border-top:.5px solid var(--line);overflow-x:auto;scrollbar-width:none}
.row2 .lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-right:6px;white-space:nowrap}
.cr{flex:none;width:62px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);font-size:11px;transition:.2s}
.cr .d{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;border:2px solid transparent;transition:.25s;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.cr .d img{width:28px;height:28px;object-fit:contain}
.cr .d b{font-family:var(--fd);font-size:10px;color:#121b33;font-weight:700}
.cr span{max-width:62px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr:hover .d{transform:translateY(-2px) scale(1.06)}
.cr.on{color:var(--gold)}.cr.on .d{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-tint)}
.back{flex:none;display:flex;align-items:center;gap:8px;height:48px;padding:0 12px 0 6px;border-radius:100px;background:var(--gold-tint);color:var(--gold);font-weight:500;white-space:nowrap}
.back .d{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;border:2px solid var(--gold)}
.back .d b{font-family:var(--fd);font-size:9px;color:#121b33;font-weight:700}
.back i{font-style:normal;opacity:.7;margin-left:2px}
.arrow{flex:none;color:var(--dim);margin:0 4px}
.clubs .cr .d{width:36px;height:36px}
.rank{font-size:10px;color:var(--dim);margin-left:auto;font-weight:400}
.pfblock{padding:4px 12px 12px}
.pfblock .pf,.pfblock .fm{flex-wrap:nowrap;gap:2px;margin-top:6px}.pfblock .pf button{width:34px;height:34px}
.pfblock .k2{font-size:11px;color:var(--muted);margin-top:4px}
.page{grid-template-columns:270px 1fr}
.side{top:150px;max-height:calc(100vh - 166px)}
</style>
</head>
<body>
<div class="page">
  <div class="bar">
    <div class="row1">
      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input placeholder="Search captions, clubs, sponsors…"></label>
      <button class="sp sp-top on" data-t><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Top Picks</button><button class="sp sp-rep" data-t><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>Replicable ideas</button><button class="sp sp-over" data-t><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="m3 17 6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>Overperforming</button>
      <span class="vr"></span>
      <button class="dd"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18"/></svg><b>This month</b><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      <button class="dd"><b>Latest</b><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>
    <div class="row2" data-rail>
      <span class="lbl">Competitions</span>
      <div style="display:flex;gap:6px" data-comps><button class="cr" data-comp="LaLiga"><span class="d"><b>LALIGA</b></span><span>LaLiga</span></button><button class="cr" data-comp="Premier League"><span class="d"><b>PL</b></span><span>Premier League</span></button><button class="cr" data-comp="Champions League"><span class="d"><b>UCL</b></span><span>Champions League</span></button><button class="cr" data-comp="Serie A"><span class="d"><b>SA</b></span><span>Serie A</span></button><button class="cr" data-comp="Bundesliga"><span class="d"><b>BL</b></span><span>Bundesliga</span></button><button class="cr" data-comp="Ligue 1"><span class="d"><b>L1</b></span><span>Ligue 1</span></button><button class="cr" data-comp="Liga F"><span class="d"><b>LF</b></span><span>Liga F</span></button><button class="cr" data-comp="Women's CL"><span class="d"><b>UWCL</b></span><span>Women's CL</span></button><button class="cr" data-comp="NBA"><span class="d"><b>NBA</b></span><span>NBA</span></button><button class="cr" data-comp="Liga ACB"><span class="d"><b>ACB</b></span><span>Liga ACB</span></button><button class="cr" data-comp="Europa League"><span class="d"><b>EL</b></span><span>Europa League</span></button><button class="cr" data-comp="MLS"><span class="d"><b>MLS</b></span><span>MLS</span></button><button class="cr" data-comp="Saudi Pro League"><span class="d"><b>SPL</b></span><span>Saudi Pro League</span></button><button class="cr" data-comp="Liga Portugal"><span class="d"><b>LPT</b></span><span>Liga Portugal</span></button><button class="cr" data-comp="Eredivisie"><span class="d"><b>ERE</b></span><span>Eredivisie</span></button></div>
      <div style="display:none;align-items:center;gap:6px" class="clubs" data-clubs>
        <button class="back" data-back><span class="d"><b>LALIGA</b></span>LaLiga<i>×</i></button><span class="arrow">›</span><button class="cr on"><span class="d"><img src="../assets/logo-realmadrid.png" alt=""></span><span>Real Madrid</span></button><button class="cr"><span class="d"><img src="../assets/logo-betis.png" alt=""></span><span>Real Betis</span></button><button class="cr"><span class="d"><img src="../assets/logo-realsociedad.png" alt=""></span><span>Real Sociedad</span></button><button class="cr"><span class="d"><b>FCB</b></span><span>Barcelona</span></button><button class="cr"><span class="d"><b>ATM</b></span><span>Atlético</span></button><button class="cr"><span class="d"><b>VCF</b></span><span>Valencia</span></button><button class="cr"><span class="d"><b>ATH</b></span><span>Athletic</span></button><button class="cr"><span class="d"><b>SEV</b></span><span>Sevilla</span></button><button class="cr"><span class="d"><b>VIL</b></span><span>Villarreal</span></button><button class="cr"><span class="d"><b>GIR</b></span><span>Girona</span></button><button class="cr"><span class="d"><b>CEL</b></span><span>Celta</span></button><button class="cr"><span class="d"><b>OSA</b></span><span>Osasuna</span></button><button class="cr"><span class="d"><b>RAY</b></span><span>Rayo</span></button><button class="cr"><span class="d"><b>MLL</b></span><span>Mallorca</span></button><button class="cr"><span class="d"><b>GET</b></span><span>Getafe</span></button>
        <button class="cr"><span class="d" style="background:var(--surface-2);box-shadow:none;border:.5px dashed var(--line)"><b style="color:var(--gold)">+5</b></span><span>All clubs</span></button>
      </div>
    </div>
  </div>

  <aside class="side">
    <div class="side-head"><h2>Filters</h2><button>Clear all</button></div>
    <div class="grp-t">1 · Where and how</div>
    <div class="pfblock"><div class="k2">Platform</div><div class="pf" data-many>
      <button class="on" title="Instagram"><svg viewBox="0 0 24 24"><defs><radialGradient id="ig" cx="30%" cy="107%" r="150%"><stop offset=".1" stop-color="#fdf497"/><stop offset=".5" stop-color="#fd5949"/><stop offset=".68" stop-color="#d6249f"/><stop offset="1" stop-color="#285AEB"/></radialGradient></defs><rect width="24" height="24" rx="6" fill="url(#ig)"/><rect x="5.5" y="5.5" width="13" height="13" rx="4" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="12" r="3.1" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="16.3" cy="7.7" r="1" fill="#fff"/></svg></button>
      <button title="TikTok"><svg viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#000"/><path d="M13.5 5v9.2a2.6 2.6 0 1 1-2.6-2.6" fill="none" stroke="#25F4EE" stroke-width="2" transform="translate(-.6 -.4)"/><path d="M13.5 5v9.2a2.6 2.6 0 1 1-2.6-2.6" fill="none" stroke="#FE2C55" stroke-width="2" transform="translate(.6 .4)"/><path d="M13.5 5v9.2a2.6 2.6 0 1 1-2.6-2.6M13.5 5c.3 2 1.7 3.3 3.8 3.4" fill="none" stroke="#fff" stroke-width="2"/></svg></button>
      <button title="YouTube"><svg viewBox="0 0 24 24"><rect x="1" y="5" width="22" height="14" rx="4.5" fill="#FF0000"/><path d="m10 9 5 3-5 3z" fill="#fff"/></svg></button>
      <button title="X"><svg viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#000"/><path d="m6.5 6 11 12M17.5 6l-11 12" stroke="#fff" stroke-width="1.8"/></svg></button>
      <button title="Facebook"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#0866FF"/><path d="M13.3 24v-8.4h2.6l.4-3.1h-3V10.6c0-.9.3-1.5 1.6-1.5h1.6V6.4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.2H7.7v3.1h2.6V24z" fill="#fff"/></svg></button>
      <button title="LinkedIn"><svg viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#0A66C2"/><path d="M7 10v7M7 7v.01M11 17v-7M11 13.5c0-2 1-3.6 3-3.6s2.5 1.4 2.5 3.3V17" stroke="#fff" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></button>
    </div><div class="k2" style="margin-top:10px">Format</div><div class="fm" data-many>
      <button class="on" data-tip="Reel"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="m10.5 9.5 4 2.5-4 2.5z"/></svg></button>
      <button data-tip="Carousel"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="11" height="16" rx="2"/><path d="M19 6v12M22 8v8"/></svg></button>
      <button data-tip="Image"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg></button>
      <button data-tip="Video"><svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="m10 9.5 5 2.5-5 2.5z"/></svg></button>
    </div></div>
    <div class="grp-t">2 · Performance</div>
    <div class="acc open"><button class="acc-h"><svg class="ico" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>Views</span><svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="acc-b">
        <div class="hist" data-hist></div>
        <div class="rng"><div class="track"></div><div class="fill" data-fill></div><input type="range" min="0" max="28" value="9" data-lo><input type="range" min="0" max="28" value="28" data-hi></div>
        <div class="rl"><b data-lo-l></b><b data-hi-l></b></div>
        <div class="rsum" data-sum></div>
      </div></div>

<script>
const comps=document.querySelector("[data-comps]"),clubs=document.querySelector("[data-clubs]");
comps.addEventListener("click",e=>{const b=e.target.closest(".cr");if(!b)return;const n=b.dataset.comp;clubs.querySelector(".back").innerHTML=b.querySelector(".d").outerHTML+n+"<i>×</i>";comps.style.display="none";clubs.style.display="flex"});
document.querySelector("[data-back]").addEventListener("click",e=>{e.stopPropagation();clubs.style.display="none";comps.style.display="flex"});
clubs.addEventListener("click",e=>{const b=e.target.closest(".cr");if(b)b.classList.toggle("on")});

// accordion
document.querySelectorAll(".acc-h").forEach(h=>h.addEventListener("click",()=>h.parentElement.classList.toggle("open")));
document.querySelectorAll(".opt").forEach(o=>o.addEventListener("click",()=>o.classList.toggle("on")));
document.querySelectorAll("[data-many]").forEach(g=>g.addEventListener("click",e=>{const b=e.target.closest("button");if(b)b.classList.toggle("on")}));
document.querySelectorAll("[data-t]").forEach(b=>b.addEventListener("click",()=>b.classList.toggle("on")));
// views: 28 log buckets from 1k to 50M
const N=28,edges=[...Array(N+1)].map((_,i)=>1000*Math.pow(50000,i/N));
const counts=[...Array(N)].map((_,i)=>Math.round(900*Math.exp(-Math.pow((i-11)/5.2,2))+20));
const max=Math.max(...counts),hist=document.querySelector("[data-hist]");
counts.forEach(c=>{const b=document.createElement("i");b.style.height=Math.max(4,c/max*100)+"%";hist.appendChild(b)});
const lo=document.querySelector("[data-lo]"),hi=document.querySelector("[data-hi]"),fill=document.querySelector("[data-fill]");
const fmt=v=>v>=1e6?(v/1e6).toFixed(v<1e7?1:0).replace(".0","")+"M":v>=1e3?Math.round(v/1e3)+"K":Math.round(v)+"";
function upd(){let a=+lo.value,b=+hi.value;if(a>b-1){if(this===lo)lo.value=a=b-1;else hi.value=b=a+1}
  hist.querySelectorAll("i").forEach((x,i)=>x.classList.toggle("in",i>=a&&i<b));
  fill.style.left=(a/N*100)+"%";fill.style.right=(100-b/N*100)+"%";
  document.querySelector("[data-lo-l]").textContent=fmt(edges[a])+" views";
  document.querySelector("[data-hi-l]").textContent=b===N?fmt(edges[b])+"+":fmt(edges[b]);
  const n=counts.slice(a,b).reduce((s,x)=>s+x,0);document.querySelector("[data-sum]").textContent=n.toLocaleString("en")+" posts in this range";
  document.querySelector("[data-chip-views]").innerHTML=fmt(edges[a])+" – "+(b===N?fmt(edges[b])+"+":fmt(edges[b]))+" views <i>×</i>"}
lo.addEventListener("input",upd);hi.addEventListener("input",upd);upd();
</script>
