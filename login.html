<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Sports Content Playbook</title>
  <meta name="description" content="Log in to Sports Content Playbook.">
  <link rel="icon" type="image/svg+xml" href="assets/icon-logo.svg">
  <link rel="icon" type="image/png" sizes="256x256" href="assets/icon-logo-lg.png">
  <link rel="apple-touch-icon" href="assets/icon-logo-lg.png">
  <link rel="stylesheet" href="css/fonts.css?v=1">
  <link rel="stylesheet" href="css/styles.css?v=20261022c">
  <script src="js/theme.js?v=20261021a"></script>
  <script src="js/i18n.js?v=20261021h"></script>
</head>
<body class="auth-page" data-auth-mode="login">
  <main class="auth">
    <a class="auth-logo" href="index.html" aria-label="Sports Content Playbook home"><img class="brand-logo" src="assets/logo-scp.png" alt="Sports Content Playbook" width="900" height="367"></a>
    <h1>Log in to <span class="gold">Sports Content Playbook</span></h1>
    <p class="auth-plan" hidden data-plan-summary></p>

    <div class="auth-card">
      <form novalidate data-signup-form>
        <label class="auth-field">Email
          <input name="email" type="email" placeholder="Your email address" autocomplete="email" required>
        </label>
        <label class="auth-field" data-password-field hidden>Password
          <input name="password" type="password" placeholder="Your password" autocomplete="current-password">
        </label>
        <button class="btn btn-gold auth-submit" type="submit" data-submit-label>Send me a login link</button>
        <button class="auth-toggle link-gold" type="button" data-password-toggle>Log in with a password instead</button>
      </form>

      <div class="auth-or"><span>or</span></div>

      <button class="auth-google" type="button" data-google-signup>
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.6 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
        Continue with Google
      </button>

      <p class="form-status" role="status" data-auth-status></p>

      <p class="auth-switch">Don’t have an account? <a class="link-gold" href="signup.html">Sign up</a></p>
    </div>

    <p class="auth-legal"><a href="index.html">← Back to the website</a></p>
  </main>

  <script src="js/vendor/supabase-2.117.0.min.js"></script>
  <script src="js/config.js?v=20261021a"></script>
  <script src="js/auth.js?v=20261018p"></script>
  <script src="js/main.js?v=20261021e"></script>
  <script src="js/signup.js?v=20261018w"></script>
  <script src="js/checkout.js?v=20261019b"></script>
</body>
</html>
